  routes:
    route_files:
      - resources/routes/train_routes_demo.xml
    sample_mode: adaptive
    adaptive:
      window_size: 10
      success_threshold: 100.0
      low_success_rate: 0.5
      high_success_rate: 0.8
      low_success_weight: 2.0
      high_success_weight: 0.75
      warmup_min_samples: 8
      log_interval_updates: 100
      hard_scenarios:
        - AccidentTwoWays
        - ConstructionObstacleTwoWays
        - CrossingBicycleFlow
        - HazardAtSideLaneTwoWays
        - OppositeVehicleTakingPriority
        - VehicleTurningRoute
        - YieldToEmergencyVehicle
        - VehicleTurningRoutePedestrian
      hard_scenario_max_gap_samples: 50
    town_partition:
      heavy_towns: []
      heavy_ratio: 0
  termination:
    type: sac
  reward:
    type: sac
  action_space:
    type: continuous_accelerate_steering_rate
    action_repeat: 1
    action_dim: 2
    continuous_actions_list:
      - [-1.0, 1.0]
      - [-1.0, 1.0]

  observation_space:
    vector:
      enable: true
      type: bev_mask
      map_dir: resources/maps
      mask_width: 64
      pixels_per_meter: 2
      ego_to_bottom: 32
      lane_style: unified
      elements:
        ego_vehicle:
          use_history: false
        navigation:
          use_history: false
        vehicles:
          use_history: true
        emergency_vehicles:
          use_history: true
        pedestrians:
          use_history: true
        red_light:
          use_history: false
        green_light:
          use_history: false
        yellow_light:
          use_history: false
        obstacles:
          use_history: true
        lanes:
          use_history: false
        stop_signs:
          use_history: false
      history_index: [-16, -11, -6, -1]
    scalars:
      items:
        - type: speed
          use_history: true
        - type: throttle
          use_history: true
        - type: brake
          use_history: true
      history_index: [-16, -11, -6, -1]
