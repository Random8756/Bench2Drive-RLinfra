algorithm:
  name: sac
  total_timesteps: 10000000
  buffer_size: 800000
  learning_starts: 40000
  batch_size: 512
  gamma: 0.99
  tau: 0.005
  learning_rate: 2.0e-4
  learning_rate_final: 5.0e-5
  train_freq: 256
  gradient_steps: 16
  ent_coef: auto
  target_update_interval: 2
  target_entropy: auto
  bc_enabled: false
  bc_lambda_initial: 2.0
  bc_lambda_decay_steps: 1000000
  bc_lambda_final: 0.0
  bc_prior_action: [0.8, 0.0]
  bc_source: lqr
  warmup_source: lqr
  exploration_mode: epsilon_greedy
  exploit_prob_initial: 0.5
  exploit_prob_final: 0.5
  exploit_prob_decay_steps: 70000000
  explore_actions:
    - [0.1, 0.0]
    - [1.0, 0.0]
    - [-1.0, 0.0]
    - [0.7, -0.5]
    - [0.7, 0.5]
    - [0.7, -1.0]
    - [0.7, 1.0]
  explore_action_repeat: 1
  per_alpha: 0.6
  per_beta: 0.4
  per_beta_annealing_steps: 3500000
  per_min_priority: 0.000001

  static_buffer:
    enabled: true
    capacity: 15000
    completion_threshold: 50.0
    strict_success_threshold: 99.9
    require_clean_for_high_completion: true
    simple_scenarios:
      - "VanillaSignalized"
    static_ratio_initial: 0.0
    static_ratio_final: 0.3
    static_ratio_anneal_steps: 5000000
    scenarios: []

policy:
  feature_extractor:
    type: combined
  features_dim: 256
  net_arch:
    pi: [256, 128]
    qf: [256, 128]
  activation_fn: relu
  log_std_init: -3.0
  distributional:
    enabled: true
    num_bins: 301
    use_symlog: true
    v_max: 900.0
    v_min: -500.0
  moe:
    aux_loss_weight: 0.01
    actor:
      enabled: true
      num_experts: 4
      top_k: 2
      noisy_gating: true
    critic:
      enabled: false
      num_experts: 4
      top_k: 2
      noisy_gating: true

training:
  seed: 42
  device: cuda
  log_dir: ./logs/sac_bev_mask
  save_freq: 200000
  verbose: 1
  log_interval: 4
  adapter:
    mode: standard
    min_ready: 4
    timeout: 120.0
  visualization:
    enabled: true
    save_interval: 10
    fps: 10
    lazy_capture: true
    overlay_info: true
    max_videos: 500

env:
  environment:
    debug_mode: false
    result_dir: ./results
    record: false
    blocked_time_out_limit: 180
    max_episode_steps: 768
    worker_recycle_interval_episodes: 40
    worker_recycle_jitter_episodes: 10
    truncation:
      penalty: -200.0
    deviation_limit: 30
    infos:
      env_id: 0
      current_step: 0
      crash: false
      crash_message: ''
      entry_status: ''
      route_id: ''
      route_num: 0
      log: false
      blocked_by_obstacles: false
      town: ''
    terminate_events:
      - COLLISION_PEDESTRIAN
      - COLLISION_VEHICLE
      - COLLISION_STATIC
      - TRAFFIC_LIGHT_INFRACTION
      - STOP_INFRACTION
      - VEHICLE_BLOCKED
      - ROUTE_DEVIATION
      - USELESS_MOVE_TIMEOUT
      - NOT_IN_CARLANE
      - SECOND_RED_SAME_LIGHT
      - SUCCESS
    termination:
      success_percent_threshold: 99.9
      off_road_threshold: 1.5
      blocked_time_out_limit: 180.0
      second_red_light_distance_threshold: 20.0
      second_red_light_clear_distance: 30.0
      second_red_stop_speed_threshold: 0.2
