algorithm:
  name: ppo
  total_timesteps: 20000000
  n_steps: 4096
  batch_size: 1024
  n_epochs: 3
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  normalize_advantage: true
  ent_coef: 0.01
  ent_coef_final: 0.01
  vf_coef: 0.15
  max_grad_norm: 0.5
  learning_rate: 1.0e-4
  learning_rate_final: 1.0e-5
  target_kl: null
  truncation: null
  success_trajectory:
    enabled: false
    output_dir: null
    compress: true
    strict_success_threshold: 99.9
    max_success_trajectories: 200

policy:
  action_distribution: beta
  beta_min_a_b_value: 1.0
  beta_epsilon: 1.0e-6
  beta_deterministic_action: mean
  feature_extractor:
    type: combined_v2
    features_dim: 256
    use_layer_norm: true
    cnn_channels: [8, 16, 32, 64, 128, 256]
    state_neurons: [256, 256]
    fusion_dims: [512]
  net_arch:
    pi: [256, 256]
    vf: [256, 256]
  use_layer_norm_policy_head: true
  value_head_type: categorical
  value_num_bins: 129
  value_support_min: -7.0
  value_support_max: 7.0
  value_transform: symlog

training:
  seed: 3407
  device: cuda
  log_dir: ./logs/ppo_bev_continuous_beta
  save_freq: 100000
  verbose: 1
  log_interval: 1
  adapter:
    mode: standard
    min_ready: 4
    timeout: 30.0
  visualization:
    enabled: true
    save_interval: 10
    fps: 10
    lazy_capture: true
    overlay_info: true
    max_videos: 1000

env:
  environment:
    debug_mode: false
    result_dir: ./results
    record: false
    blocked_time_out_limit: 180
    max_episode_steps: 1024
    worker_recycle_interval_episodes: 40
    worker_recycle_jitter_episodes: 10
    deviation_limit: 30
    terminate_events:
      - COLLISION_PEDESTRIAN
      - COLLISION_VEHICLE
      - COLLISION_STATIC
      - TRAFFIC_LIGHT_INFRACTION
      - STOP_INFRACTION
      - VEHICLE_BLOCKED
      - ROUTE_DEVIATION
      - USELESS_MOVE_TIMEOUT
      - NOT_IN_CARLANE
      - SECOND_RED_SAME_LIGHT
    termination:
      success_percent_threshold: 99.9
      off_road_threshold: 1.5
      blocked_time_out_limit: 180.0
      second_red_light_distance_threshold: 20.0
      second_red_light_clear_distance: 30.0
      second_red_stop_speed_threshold: 0.2
  carla:
    load_world_timeout: 400
    worker_ready_timeout: 1800
    disable_watchdog: true
    num_envs: 24
